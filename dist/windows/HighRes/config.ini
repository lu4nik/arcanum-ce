// Arcanum CE fork (lu4nik): display and input settings (UAP HighRes format).
// Width/Height: internal resolution, 0 = automatic (about 720 game rows,
//   whole scale factor where one fits). Options > Video > Scale writes these.
Width=0
Height=0
Windowed=0
// Smooth: -1 best available, 0 plain pixels, 1 xBR.
//   Options > Video > Smoothing (or F9) switches it in game.
Smooth=-1
// SmoothUI: 1 also smooth interface and text, 0 keep them crisp.
SmoothUI=1
// WheelScroll: map panning for touchpad swipes, 0 off, negative inverts.
WheelScroll=24
// AutoSave: autosave every N real minutes into two rotating slots (never over F7), 0 off.
AutoSave=10
// Gamepad: 1 = play with a gamepad (DualSense, Xbox...) as mouse+keyboard, 0 = off.
Gamepad=1
// Cursor speed at full left stick, pixels per second.
GamepadCursorSpeed=900
// Map pan speed at full right stick, pixels per second.
GamepadPanSpeed=1100
// ScrollDist: how far the view may scroll away from your character (the
//   original rule, grows with Perception), 0 = no limit.
ScrollDist=10
